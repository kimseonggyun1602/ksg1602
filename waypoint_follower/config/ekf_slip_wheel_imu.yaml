ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    use_control: false
    use_sim_time: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Wheel encoders provide continuous body velocity. Pose and wheel yaw rate
    # are disabled so the same slip-corrupted source is not fused repeatedly.
    odom0: /wheel_odom/slip
    odom0_config: [
      false, false, false,
      false, false, false,
      true,  true,  false,
      false, false, false,
      false, false, false
    ]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 20
    odom0_twist_rejection_threshold: 4.0

    # IMU gyro constrains heading dynamics. Planar translation is intentionally
    # not inferred by double-integrating acceleration.
    imu0: /imu/data
    imu0_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,
      false, false, false
    ]
    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: false
    imu0_queue_size: 20
    imu0_angular_velocity_rejection_threshold: 4.0

    process_noise_covariance: [
      0.08, 0.12, 0.06,
      0.03, 0.03, 0.10,
      0.05, 0.15, 0.04,
      0.01, 0.01, 0.05,
      0.01, 0.01, 0.015
    ]
